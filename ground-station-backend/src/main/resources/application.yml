spring:
  application:
    name: ground-station-backend

server:
  port: ${PORT:8080}

groundstation:
  satellite-url: ws://localhost:8081/link
  allowed-origin: http://localhost:5173
  connect-timeout: 2s
  max-sessions: 3
  session-idle-timeout: 60s
  history:
    sample-interval-seconds: 10
    capacity: 2000
